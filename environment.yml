name: trial_env2
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy
  - scipy
  - pytorch
  # older builds (e.g. 0.1.70) don't pin ezc3d and fail to import with ezc3d 1.7.x
  - pymomentum>=0.1.114
  - chumpy
  - trimesh
  - ezc3d
  - pybind11

  - pip:
      - addict
      - configargparse
      - dash
      - ipdb
      - ipython
      - joblib
      - loguru
      - matplotlib
      # 0.20 macOS wheels need Homebrew's libusb
      - open3d==0.19.0
      - pandas
      - plotly
      - pydantic
      - pyquaternion
      - pyyaml
      - requests
      - roma
      - scikit-learn
      - smplx
      - toml
      - tqdm
      - anny==0.3.1
      - mhr==1.0.1
