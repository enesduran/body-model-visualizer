name: Build standalone app

# PyInstaller cannot cross-compile, so each OS builds its own bundle. Model
# files are not in the repository (MPI licences forbid redistribution); the
# artifacts contain no models. Users create data/body_models next to the
# app and copy their own files in (see README, "Building a standalone app").
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: BodyModelVisualizer-linux-x86_64
            torch_index: https://download.pytorch.org/whl/cpu
          - os: windows-latest
            artifact: BodyModelVisualizer-windows-x86_64
            torch_index: https://download.pytorch.org/whl/cpu
          - os: macos-14
            artifact: BodyModelVisualizer-macos-arm64
            torch_index: https://pypi.org/simple
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux system libraries for Open3D
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libgomp1 libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libglu1-mesa xvfb
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy setuptools wheel
          python -m pip install --no-build-isolation --extra-index-url "${{ matrix.torch_index }}" -r packaging/requirements-app.txt
      - name: Build
        run: python -m PyInstaller --noconfirm --workpath build/bmvis packaging/bmvis.spec
      - name: Smoke test (imports and argument parsing)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            "dist/Body Model Visualizer.app/Contents/MacOS/Body Model Visualizer" --help
          elif [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "dist/Body Model Visualizer/Body Model Visualizer" --help
          else
            "dist/Body Model Visualizer/Body Model Visualizer.exe" --help
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "dist/Body Model Visualizer.app" "out/${{ matrix.artifact }}.zip"
          else
            cd dist && 7z a -r "../out/${{ matrix.artifact }}.zip" "Body Model Visualizer" > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*.zip
          retention-days: 14

  # On an app-v* tag, publish the three bundles as a GitHub Release. This runs
  # on GitHub's side, so the 1.3 GB of artifacts never travel through a
  # developer's connection.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BodyModelVisualizer-*
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Standalone builds of the visualizer for Linux (x86_64), Windows (x86_64) and macOS (Apple Silicon).

          These bundles contain **no body model files**. After unzipping, create `data/body_models/<model>/` next to the executable (beside the `.app` on macOS) and copy in your own SMPL, SMPL-X, MANO, FLAME, STAR or SUPR files using the layout in the README; the app offers whatever it finds there. MHR assets go to `data/body_models/mhr/assets/`.

          macOS: the app is ad-hoc signed, so use right-click > Open the first time. Windows may show a SmartScreen prompt for the unsigned executable.
          EOF
          gh release create "$GITHUB_REF_NAME" out/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Body Model Visualizer ${GITHUB_REF_NAME#app-v}" \
            --notes-file notes.md
